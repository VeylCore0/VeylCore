# VeylCore txAdmin recipe (native profile: veyl_lib / veyl_target / veyl_inventory, no ox resources).
# Use in txAdmin: Setup -> "Remote URL Template" -> the raw URL of this file.
# The GitHub repository must be PUBLIC for txAdmin to download it (txAdmin downloads anonymously).
$engine: 3
$minFxVersion: 5848
$onesync: on
name: VeylCore
version: 0.3.0
author: VeylCore
description: >-
  VeylCore roleplay framework: QB-style core (citizenid, PlayerData, multijob, ledger money), character select,
  appearance, spawn, HUD, needs, banking, jobs, vehicles/keys/fuel, shops, GoPostal delivery job, staff tools, pma-voice,
  an optional qb-core compatibility shim, and native veyl_lib / veyl_target / veyl_inventory.
  Database tables are created automatically on first boot.

tasks:
  # Base CFX resources (mapmanager, chat, sessionmanager, ...).
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    subpath: resources
    dest: ./resources

  # SQL driver.
  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.3/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./resources/[standalone]

  # Proximity voice and phone calls. The last tagged pma-voice release is from 2022, so this pins a commit of its
  # maintained main branch. Must start before veyl_hud (the HUD detects it once at start).
  - action: download_github
    src: https://github.com/AvarianKnight/pma-voice
    ref: 6c9d96ed7a02e30912f1a0ce92629bf9afbbca8c
    dest: ./resources/[standalone]/pma-voice

  # VeylCore resources, pinned to a tested commit. Update `ref` when you release a new version.
  - action: download_github
    src: https://github.com/VeylCore0/VeylCore
    ref: 355f62c765be8cbbb4bcddd3e717abf2a0fe73b6
    subpath: resources/[veyl]
    dest: ./resources/[veyl]

  # Starlite Motel MLO by Zydrec (free; credit: Zydrec). veyl_apartments manages its 30 rooms. Pinned to a tested commit.
  - action: download_github
    src: https://github.com/Zydrec/zydrec-starlitemotel
    ref: 938925392446016f9bd4f2a7325a5b24b9b45523
    dest: ./resources/zydrec-starlitemotel

  # VeylCore owns spawning: the default spawn manager and basic gamemode must not run.
  - action: remove_path
    path: ./resources/[managers]/spawnmanager
  - action: remove_path
    path: ./resources/[gamemodes]/basic-gamemode

  - action: remove_path
    path: ./tmp

  # Creates the database chosen in the setup wizard. No SQL import: every VeylCore resource
  # migrates its own tables on first start (recorded in veyl_migrations).
  - action: connect_database

  - action: write_file
    file: ./server.cfg
    data: |
      ## VeylCore server.cfg (generated by the txAdmin recipe)
      {{serverEndpoints}}
      sv_maxclients {{maxClients}}
      sv_licenseKey "{{svLicense}}"
      sv_enforceGameBuild 3751
      set steam_webApiKey "none"

      ## Database
      set mysql_connection_string "{{dbConnectionString}}"

      ## Base resources
      ensure mapmanager
      ensure chat
      ensure sessionmanager
      ensure hardcap

      ## VeylCore (native profile). Do NOT add ox_lib, ox_target, ox_inventory or upstream qb-core.
      ensure oxmysql
      ensure pma-voice
      setr voice_useNativeAudio true   # pma-voice: native 3D audio
      setr voice_enableUi 0            # the VeylCore HUD shows talking and range
      ensure veyl_lib
      ensure veyl_core
      ensure qb-core
      ensure veyl_vehicles
      ensure veyl_inventory
      ensure veyl_target
      ensure veyl_ui
      ensure veyl_minigames
      ensure veyl_world
      ensure veyl_interact
      ensure veyl_appearance
      ensure veyl_spawn
      ensure veyl_characters
      ensure veyl_hud
      ensure veyl_needs
      ensure veyl_vehiclekeys
      ensure veyl_fuel
      ensure veyl_banking
      ensure veyl_jobs
      ensure veyl_shops
      ensure veyl_garages
      ensure veyl_dealership
      ensure veyl_mechanic
      ensure veyl_customs
      ensure veyl_weedprops   # custom weed models (must start before veyl_production)
      ensure veyl_production
      ensure veyl_scavenge
      ensure veyl_cartheft
      ensure veyl_blackmarket
      ensure veyl_phone
      ensure veyl_loadscreen
      ensure zydrec-starlitemotel
      ensure veyl_apartments
      ensure veyl_doorlocks
      ensure veyl_cityhall
      ensure veyl_management
      ensure veyl_medical
      ensure veyl_emotes
      ensure veyl_dispatch
      ensure veyl_police
      ensure veyl_mdt
      ensure veyl_prison
      ensure veyl_departments
      ensure veyl_robbery
      ensure veyl_fishing
      ensure veyl_business
      ensure veyl_crime
      ensure veyl_heists
      ensure veyl_boosting
      ensure veyl_doctor
      ensure veyl_delivery
      ensure veyl_citizenjobs
      ensure veyl_gathering
      ensure veyl_crafting
      ensure veyl_admin
      # ensure veyl_qbexample   # optional QBCore-style example resource

      ## Permissions
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      add_ace group.admin veyl.admin allow
      {{addPrincipalsMaster}}

  # Fill in the {{...}} values chosen in the setup wizard.
  - action: replace_string
    mode: template
    file: ./server.cfg
