<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>veyl_appearance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="editor" class="panel hidden">
    <div class="header">
        <div class="title">Appearance</div>
        <div class="tabs">
            <button class="tab active" data-tab="body">Body</button>
            <button class="tab" data-tab="clothing">Clothing</button>
        </div>
    </div>
    <div class="body">
        <div id="tab-body">
            <div class="field"><label>Body type</label>
                <div class="seg">
                    <button class="seg-btn" data-sex="m">Masculine</button>
                    <button class="seg-btn" data-sex="f">Feminine</button>
                </div>
            </div>
            <div id="blend"></div>
        </div>
        <div id="tab-clothing" class="hidden"></div>
    </div>
    <div class="footer">
        <div class="rotate">
            <button class="btn" data-rot="-30">⟲</button>
            <button class="btn" data-rot="30">⟳</button>
        </div>
        <div id="error" class="error"></div>
        <button class="btn" id="cancel">Cancel</button>
        <button class="btn primary" id="save">Save</button>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
