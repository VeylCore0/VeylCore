<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lockpick</title>
<style>
  :root { --bg: rgba(9, 11, 16, 0.78); --metal: #c9ccd4; --dim: #5b6070; --ok: #6ee7b7; --bad: #f87171; --accent: #f5c451; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font-family: 'Segoe UI', Inter, system-ui, sans-serif; color: #e8eaf0; user-select: none; overflow: hidden; }
  #root { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; }
  #root.on { display: flex; }
  .card { width: 380px; padding: 22px 22px 18px; border-radius: 18px; background: var(--bg); border: 1px solid rgba(255,255,255,0.08);
          box-shadow: 0 20px 60px rgba(0,0,0,0.55); backdrop-filter: blur(6px); text-align: center; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
  .title { font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .sub { font-size: 12px; color: #9aa0ae; margin-top: 4px; }
  svg { display: block; margin: 14px auto 8px; overflow: visible; }
  .pins { display: flex; justify-content: center; gap: 8px; margin: 6px 0 12px; }
  .pin { width: 12px; height: 26px; border-radius: 4px; background: #2a2e38; border: 1px solid #3a3f4c; transition: all .15s; }
  .pin.set { background: var(--ok); border-color: var(--ok); transform: translateY(-5px); box-shadow: 0 0 10px rgba(110,231,183,.6); }
  .strain { height: 6px; border-radius: 3px; background: #2a2e38; overflow: hidden; margin: 0 26px; }
  .strain > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f5c451, #f87171); transition: width .2s; }
  .hint { margin-top: 12px; font-size: 12px; color: #9aa0ae; }
  kbd { display: inline-block; padding: 1px 7px; border-radius: 5px; background: #2a2e38; border: 1px solid #444a58; color: #e8eaf0; font-size: 11px; font-family: inherit; }
  .card.shake { animation: shake .3s; }
  @keyframes shake { 20%,60% { transform: translateX(-7px) } 40%,80% { transform: translateX(7px) } }
  .result { font-size: 18px; font-weight: 800; letter-spacing: .1em; margin-top: 6px; height: 22px; }
  .result.ok { color: var(--ok); } .result.bad { color: var(--bad); }
</style>
</head>
<body>
<div id="root">
  <div class="card" id="card">
    <div class="title" id="title">Pick the lock</div>
    <div class="sub" id="sub">Hit the gold zone to set each pin</div>
    <svg id="lock" width="220" height="220" viewBox="-110 -110 220 220">
      <defs>
        <radialGradient id="face" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#3a3f4c"/><stop offset="1" stop-color="#181b22"/></radialGradient>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6e8ee"/><stop offset="1" stop-color="#6b7080"/></linearGradient>
      </defs>
      <circle r="100" fill="url(#ring)"/>
      <circle r="92" fill="url(#face)"/>
      <circle r="78" fill="none" stroke="#2a2e38" stroke-width="10"/>
      <path id="zone" fill="none" stroke="#f5c451" stroke-width="10" stroke-linecap="round"/>
      <g id="ticks"></g>
      <rect x="-6" y="-26" width="12" height="52" rx="5" fill="#0d0f14" stroke="#4a4f5c"/>
      <circle r="9" fill="#0d0f14" stroke="#4a4f5c"/>
      <g id="pick"><line x1="0" y1="0" x2="0" y2="-82" stroke="#e8eaf0" stroke-width="4" stroke-linecap="round"/><circle cy="-82" r="5" fill="#e8eaf0"/></g>
    </svg>
    <div class="pins" id="pins"></div>
    <div class="strain"><i id="strain"></i></div>
    <div class="result" id="result"></div>
    <div class="hint"><kbd>SPACE</kbd> / <kbd>E</kbd> / click to set the pin &nbsp;·&nbsp; <kbd>ESC</kbd> to give up</div>
  </div>
</div>
<script>
(() => {
  const RES = (window.GetParentResourceName && window.GetParentResourceName()) || 'veyl_minigames';
  const post = (name, body) => fetch(`https://${RES}/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json; charset=UTF-8' }, body: JSON.stringify(body || {}) }).catch(() => {});
  const $ = (id) => document.getElementById(id);
  const PRESETS = { easy: { pins: 3, zone: 46, speed: 140, shrink: 4, misses: 4 }, medium: { pins: 4, zone: 36, speed: 175, shrink: 4, misses: 3 }, hard: { pins: 5, zone: 28, speed: 215, shrink: 3, misses: 3 } };
  let st = null, raf = 0, audio = null;

  // Small WebAudio clicks (no files).
  function tone(freq, dur, type = 'square', vol = 0.05) {
    try {
      audio = audio || new AudioContext();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const arc = (a0, a1, r) => {
    const p = (a) => [Math.sin(a * Math.PI / 180) * r, -Math.cos(a * Math.PI / 180) * r];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `M ${x0} ${y0} A ${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`;
  };
  function newZone() {
    const width = Math.max(14, st.zone - st.set * st.shrink);
    let center;
    do { center = Math.random() * 360; } while (Math.abs(((center - st.angle + 540) % 360) - 180) < 70);
    st.z0 = center - width / 2; st.z1 = center + width / 2;
    $('zone').setAttribute('d', arc(st.z0, st.z1, 78));
  }
  function inZone(a) {
    const n = (x) => ((x % 360) + 360) % 360;
    const a0 = n(st.z0), a1 = n(st.z1), x = n(a);
    return a0 <= a1 ? x >= a0 && x <= a1 : x >= a0 || x <= a1;
  }
  function draw() {
    $('pins').innerHTML = Array.from({ length: st.pins }, (_, i) => `<div class="pin${i < st.set ? ' set' : ''}"></div>`).join('');
    $('strain').style.width = `${(st.missed / st.misses) * 100}%`;
  }
  function loop(t) {
    if (!st || st.done) return;
    const dt = st.last ? (t - st.last) / 1000 : 0;
    st.last = t;
    st.angle = (st.angle + st.dir * st.speed * (1 + st.set * 0.12) * dt + 360) % 360;
    $('pick').setAttribute('transform', `rotate(${st.angle})`);
    raf = requestAnimationFrame(loop);
  }
  function finish(success) {
    if (!st || st.done) return;
    st.done = true;
    cancelAnimationFrame(raf);
    $('result').textContent = success ? 'UNLOCKED' : 'PICK BROKE';
    $('result').className = 'result ' + (success ? 'ok' : 'bad');
    if (success) { tone(880, .12, 'triangle', .08); setTimeout(() => tone(1320, .2, 'triangle', .08), 110); } else { tone(110, .35, 'sawtooth', .07); }
    setTimeout(() => { $('root').classList.remove('on'); post('result', { success, session: st.session }); st = null; }, success ? 650 : 800);
  }
  function attempt() {
    if (!st || st.done) return;
    if (inZone(st.angle)) {
      st.set++; tone(1200 + st.set * 120, .06); st.dir = Math.random() < 0.5 ? -st.dir : st.dir;
      if (st.set >= st.pins) { draw(); return finish(true); }
      newZone();
    } else {
      st.missed++; tone(180, .12, 'sawtooth'); $('card').classList.remove('shake'); void $('card').offsetWidth; $('card').classList.add('shake');
      if (st.missed >= st.misses) { draw(); return finish(false); }
    }
    draw();
  }
  function open(data, session) {
    const p = Object.assign({}, PRESETS[data.difficulty] || PRESETS.medium, data);
    st = { session, pins: Math.min(8, Math.max(1, p.pins | 0)), zone: p.zone, speed: p.speed, shrink: p.shrink, misses: Math.max(1, p.misses | 0),
           set: 0, missed: 0, angle: 0, dir: 1, last: 0, done: false };
    $('title').textContent = data.title || 'Pick the lock';
    $('sub').textContent = data.subtitle || 'Hit the gold zone to set each pin';
    $('result').textContent = ''; $('result').className = 'result';
    $('ticks').innerHTML = Array.from({ length: 24 }, (_, i) => `<line x1="0" y1="-92" x2="0" y2="${i % 6 ? -88 : -84}" stroke="#4a4f5c" stroke-width="2" transform="rotate(${i * 15})"/>`).join('');
    newZone(); draw();
    $('root').classList.add('on');
    raf = requestAnimationFrame(loop);
  }
  window.addEventListener('message', (e) => {
    const m = e.data || {};
    if (m.action === 'lockpick:open') open(m.data || {}, m.session);
    if (m.action === 'lockpick:close' && st) { st.done = true; cancelAnimationFrame(raf); st = null; $('root').classList.remove('on'); }
  });
  window.addEventListener('keydown', (e) => {
    if (!st) return;
    if (e.code === 'Space' || e.code === 'KeyE') { e.preventDefault(); if (!e.repeat) attempt(); }
    if (e.code === 'Escape') { e.preventDefault(); finish(false); }
  });
  window.addEventListener('mousedown', (e) => { if (st && e.button === 0) attempt(); });
  post('ui:ready');
})();
</script>
</body>
</html>
