<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>veyl_hud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="hud" class="hidden">
    <div id="status" class="status"></div>
    <div id="money" class="money">
        <div><span class="k">Cash</span><span id="cash">$0</span></div>
        <div><span class="k">Bank</span><span id="bank">$0</span></div>
        <div id="job" class="job"></div>
    </div>
    <div id="vehicle" class="vehicle hidden">
        <div class="speed"><span id="speed">0</span><small>MPH</small></div>
        <div class="fuel"><div class="fuel-label">FUEL <span id="locked"></span></div><div class="bar"><div id="fuel" class="fill"></div></div></div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
